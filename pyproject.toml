[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-specter"
version = "0.1.0"
description = "Specter AI — AI-driven automated penetration testing from your terminal, with a per-task LLM model advisor, an autonomous agent mode, and end-to-end reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sam Gupta" }]
maintainers = [{ name = "Sam Gupta" }]
keywords = [
    "pentest", "penetration-testing", "security", "ai", "llm", "agent",
    "red-team", "offensive-security", "c2", "automation", "infosec",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
claude = ["anthropic>=0.34.0"]
openai = ["openai>=1.40.0"]
server = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
mcp = ["mcp>=1.0.0"]
all = [
    "anthropic>=0.34.0", "openai>=1.40.0",
    "fastapi>=0.110.0", "uvicorn>=0.29.0", "mcp>=1.0.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
specter = "specter.cli:app"

[project.urls]
Homepage = "https://sam00.github.io/AI-Specter/"
Documentation = "https://sam00.github.io/AI-Specter/"
Repository = "https://github.com/sam00/AI-Specter"
Issues = "https://github.com/sam00/AI-Specter/issues"
Changelog = "https://github.com/sam00/AI-Specter/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["specter*"]

[tool.ruff]
line-length = 100
target-version = "py310"
